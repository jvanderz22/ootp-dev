@if (showChrome()) {
  <header class="topbar">
    <a routerLink="/" class="brand">OOTP Ops</a>

    <nav class="row">
      @for (lg of recentLeagues(); track lg.id) {
        <a [routerLink]="['/league', lg.id]" routerLinkActive="active">{{ lg.name }}</a>
      }
      <a routerLink="/settings" routerLinkActive="active">Settings</a>
    </nav>

    <span class="spacer"></span>
    @if (store.loading()) { <span class="muted">syncing…</span> }
    <span class="engine-toggle wide-only" role="group" aria-label="Ranking engine">
      <span class="muted">Engine</span>
      @for (e of engines; track e) {
        <button type="button" [class.active]="engine() === e" [attr.aria-pressed]="engine() === e"
          (click)="setEngine(e)">{{ e }}</button>
      }
    </span>
    <button class="wide-only" (click)="logout()">Log out</button>

    <!-- phones: the engine toggle and log out fold into one menu -->
    <span class="more narrow-only">
      <button
        type="button"
        class="more-btn"
        aria-label="More"
        [attr.aria-expanded]="moreOpen()"
        (click)="moreOpen.set(!moreOpen())"
      >
        <i class="pi pi-ellipsis-h"></i>
      </button>
      @if (moreOpen()) {
        <div class="more-menu" role="menu">
          <span class="muted">Ranking engine</span>
          <span class="engine-toggle" role="group" aria-label="Ranking engine">
            @for (e of engines; track e) {
              <button type="button" [class.active]="engine() === e" [attr.aria-pressed]="engine() === e"
                (click)="setEngine(e)">{{ e }}</button>
            }
          </span>
          <button type="button" (click)="moreOpen.set(false); logout()">Log out</button>
        </div>
      }
    </span>
  </header>
}

<main class="content">
  @if (store.error()) {
    <p class="error">{{ store.error() }}</p>
  }
  <router-outlet />
</main>
