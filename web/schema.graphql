scalar JSON
scalar Upload

type DraftClass {
  name: String!
  rankingMethod: String!
  playerCount: Int!
  hasCustomOrder: Boolean!
  lastProcessed: String
  draftedCount: Int!
}

type RankedPlayer {
  rank: Int!
  id: ID!
  name: String!
  position: String!
  type: String!
  age: Int
  batHand: String
  throwHand: String
  modelScore: Float
  inGameOverall: Int
  inGamePotential: Int
  demand: String
  drafted: Boolean!
  positionPlayerScore: Float
  pitcherScore: Float
  battingScoreComponent: Float
  fieldingScoreComponent: Float
  starterComponent: Float
  relieverComponent: Float
  runningScoreComponent: Float
  rawOverallScore: Float
  components: JSON
  ratings: JSON
}

input RankedPlayerFilter {
  search: String
  positions: [String!]
  hideDrafted: Boolean
}

input RankedPlayerSort {
  field: String!
  order: Int!
}

type RankedPlayerPage {
  rows: [RankedPlayer!]!
  totalRecords: Int!
}

type StatsPlusSettings {
  leagueUrl: String
  defaultLid: Int
  hasSessionid: Boolean!
  hasCsrftoken: Boolean!
}

type DraftedRefreshResult {
  draftedCount: Int!
  matchedById: Int!
  matchedByName: Int!
  unmatched: Int!
}

type Query {
  draftClasses: [DraftClass!]!
  draftClass(name: String!): DraftClass
  rankedPlayers(
    name: String!
    filter: RankedPlayerFilter
    sort: RankedPlayerSort
    page: Int = 0
    pageSize: Int = 50
    allRows: Boolean = false
  ): RankedPlayerPage!
  classPositions(name: String!): [String!]!
  statsPlusSettings: StatsPlusSettings!
}

type Mutation {
  uploadDraftClass(name: String!, rankingMethod: String!, file: Upload!): DraftClass!
  setRankingMethod(name: String!, rankingMethod: String!): DraftClass!
  reprocessDraftClass(name: String!): DraftClass!
  deleteDraftClass(name: String!): String!
  saveCustomOrder(name: String!, order: [ID!]!): DraftClass!
  clearCustomOrder(name: String!): DraftClass!
  refreshDraftedFromStatsPlus(name: String!): DraftedRefreshResult!
  updateStatsPlusSettings(
    leagueUrl: String
    sessionid: String
    csrftoken: String
    defaultLid: Int
  ): StatsPlusSettings!
}
