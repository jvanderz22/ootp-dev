scalar JSON
scalar Upload

type DraftClass {
  name: String!
  rankingMethod: String!
  playerCount: Int!
  hasCustomOrder: Boolean!
  lastProcessed: String
  draftedCount: Int!
  leagueId: String
  leagueName: String
}

type League {
  id: ID!
  name: String!
  leagueUrl: String
  defaultLid: Int
  classNames: [String!]!
  "ISO timestamp of the last snapshot pull, or null if never refreshed."
  updatedAt: String
}

type RankedPlayer {
  rank: Int!
  id: ID!
  name: String!
  position: String!
  "the model's best-fit fielding position (null for pitchers)"
  bestPosition: String
  type: String!
  age: Int
  batHand: String
  throwHand: String
  "live-league snapshot only: parent org name, roster team name, level"
  org: String
  team: String
  level: String
  "live-league snapshot only: link to the player's StatsPlus page"
  statsPlusUrl: String
  modelScore: Float
  inGameOverall: Int
  inGamePotential: Int
  demand: String
  drafted: Boolean!
  draftedTeam: String
  draftedPick: Int
  draftedRound: Int
  draftedRoundPick: Int
  positionPlayerScore: Float
  pitcherScore: Float
  battingScoreComponent: Float
  fieldingScoreComponent: Float
  starterComponent: Float
  relieverComponent: Float
  runningScoreComponent: Float
  rawOverallScore: Float
  components: JSON
  ratings: JSON
}

input RankedPlayerFilter {
  search: String
  positions: [String!]
  bestPositions: [String!]
  batHands: [String!]
  throwHands: [String!]
  teams: [String!]
  "live-league snapshot only: keep only these playing levels (MLB, AAA, ...)"
  levels: [String!]
  hideDrafted: Boolean
  numeric: [NumericFilter!]
}

"""
A greater-than / less-than bound on any sortable column. `field` uses the same
keys as RankedPlayerSort (a flat payload key, a dotted rating path like
`batting.power`, `pitch.<Name>`, `demandKey`, or a descriptive-grade meta key).
`min` / `max` are inclusive; graded text columns compare on their tier ordinal.
"""
input NumericFilter {
  field: String!
  min: Float
  max: Float
}

input RankedPlayerSort {
  field: String!
  order: Int!
}

type RankedPlayerPage {
  rows: [RankedPlayer!]!
  totalRecords: Int!
}

type StatsPlusSettings {
  hasSessionid: Boolean!
  hasCsrftoken: Boolean!
}

"One stored live-league snapshot pulled from StatsPlus (the whole player pool)."
type LeagueSnapshot {
  leagueId: ID!
  fetchedAt: String
  playerCount: Int!
  "Ranking methods already scored to disk for this snapshot (subset of overall/potential)."
  rankedMethods: [String!]!
}

"A club in the league's org tree. `parentTeamId` is null for a top-level org."
type LeagueTeam {
  id: ID!
  name: String!
  parentTeamId: ID
  "playing level of this club in the snapshot (MLB, AAA, AA, A, A-, R); null for an org row or a club with no ranked players"
  level: String
}

enum LeagueGroupBy {
  LEAGUE
  ORG
  TEAM
}

"""
Result of the on-load freshness check for a stored league snapshot.
`stale` = the sim advanced past the snapshot's `leagueDate`; the page should
refresh. `checked` = the league's in-game date was actually fetched this call
(only when the snapshot is more than a day old).
"""
type LeagueFreshness {
  snapshot: LeagueSnapshot
  stale: Boolean!
  checked: Boolean!
  leagueDate: String
}

"""
Progress of a background league-snapshot refresh. `state` is one of
`idle` | `running` | `done` | `error`. The job outlives the request that
started it, so a client that navigated away can poll back in and re-attach.
"""
type LeagueRefreshStatus {
  leagueId: ID!
  state: String!
  startedAt: String
  finishedAt: String
  error: String
  "Human-readable line describing the current step, set only while `state` is `running`."
  progress: String
  snapshot: LeagueSnapshot
}

type DraftedRefreshResult {
  draftedCount: Int!
  matchedById: Int!
  matchedByName: Int!
  unmatched: Int!
}

type Query {
  draftClasses: [DraftClass!]!
  draftClass(name: String!): DraftClass
  rankedPlayers(
    name: String!
    filter: RankedPlayerFilter
    sort: RankedPlayerSort
    page: Int = 0
    pageSize: Int = 50
    allRows: Boolean = false
  ): RankedPlayerPage!
  classPositions(name: String!): [String!]!
  draftTeams(name: String!): [String!]!
  statsPlusSettings: StatsPlusSettings!
  leagues: [League!]!
  leagueSnapshot(leagueId: ID!): LeagueSnapshot
  leagueSnapshotPlayers(
    leagueId: ID!
    method: String!
    groupBy: LeagueGroupBy!
    groupId: ID
    filter: RankedPlayerFilter
    sort: RankedPlayerSort
    page: Int = 0
    pageSize: Int = 50
    allRows: Boolean = false
  ): RankedPlayerPage!
  leagueOrgs(leagueId: ID!): [LeagueTeam!]!
  leagueTeams(leagueId: ID!): [LeagueTeam!]!
  "Distinct playing levels present in the snapshot, ordered MLB-first - the level filter's options."
  leagueLevels(leagueId: ID!): [String!]!
  "Status of the in-flight (or last) background refresh for this league."
  leagueRefreshStatus(leagueId: ID!): LeagueRefreshStatus!
}

type Mutation {
  uploadDraftClass(name: String!, rankingMethod: String!, file: Upload!): DraftClass!
  setRankingMethod(name: String!, rankingMethod: String!): DraftClass!
  reprocessDraftClass(name: String!): DraftClass!
  deleteDraftClass(name: String!): String!
  saveCustomOrder(name: String!, order: [ID!]!): DraftClass!
  setPlayerRank(name: String!, id: ID!, rank: Int!): DraftClass!
  clearCustomOrder(name: String!): DraftClass!
  refreshDraftedFromStatsPlus(name: String!): DraftedRefreshResult!
  updateStatsPlusSettings(sessionid: String, csrftoken: String): StatsPlusSettings!
  createLeague(
    name: String!
    leagueUrl: String
    defaultLid: Int
    classNames: [String!]
  ): League!
  updateLeague(
    id: ID!
    name: String
    leagueUrl: String
    defaultLid: Int
    classNames: [String!]
  ): League!
  deleteLeague(id: ID!): String!
  setClassLeague(name: String!, leagueId: String): DraftClass!
  "Start a background snapshot refresh; returns immediately with `state: running`."
  refreshLeagueSnapshot(leagueId: ID!): LeagueRefreshStatus!
  checkLeagueSnapshotFreshness(leagueId: ID!): LeagueFreshness!
}
